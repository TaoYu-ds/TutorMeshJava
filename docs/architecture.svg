<svg xmlns="http://www.w3.org/2000/svg" width="960" height="646" viewBox="0 0 960 646" font-family="'Microsoft YaHei','PingFang SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="960" height="646" fill="#ffffff"/>

  <!-- 列标题 -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">主链路 · MAIN PIPELINE</text>
  <text x="616" y="20" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">支撑能力 · SUPPORTING</text>

  <!-- ============ 行 1 输入 ============ -->
  <rect x="32" y="28" width="560" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="312" y="50" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">学生提问</text>
  <text x="312" y="68" font-size="12" fill="#64748b" text-anchor="middle">K12 学科答疑 · 学习规划 · 考试事务</text>

  <!-- 箭头 1→2 -->
  <line x1="312" y1="78" x2="312" y2="102" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ 行 2 API ============ -->
  <rect x="32" y="104" width="560" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="104" width="4" height="64" rx="2" fill="#2563eb"/>
  <text x="54" y="130" font-size="14" font-weight="600" fill="#0f172a">接入层 · Spring Boot 3.5</text>
  <text x="54" y="152" font-size="12.5" fill="#64748b">REST / SSE 流式返回 / Swagger 文档 · 请求校验与限流</text>

  <!-- 箭头 2→3 -->
  <line x1="312" y1="168" x2="312" y2="192" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ 行 3 意图 ============ -->
  <rect x="32" y="194" width="560" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="194" width="4" height="82" rx="2" fill="#0d9488"/>
  <text x="54" y="220" font-size="14" font-weight="600" fill="#0f172a">意图识别 · 三路加权投票</text>
  <text x="54" y="242" font-size="12.5" fill="#334155">
    <tspan font-weight="600" fill="#0d9488">LLM 语义 0.70</tspan>
    <tspan fill="#94a3b8"> + </tspan>
    <tspan font-weight="600" fill="#0d9488">字符 n-gram 0.20</tspan>
    <tspan fill="#94a3b8"> + </tspan>
    <tspan font-weight="600" fill="#0d9488">关键词 0.10</tspan>
  </text>
  <text x="54" y="262" font-size="12.5" fill="#64748b">→ 13 类意图 · 4 档紧急度 · 置信度不足降级为 OTHER，避免误路由</text>

  <!-- 箭头 3→4 -->
  <line x1="312" y1="276" x2="312" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ 行 4 路由 ============ -->
  <rect x="32" y="300" width="560" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="300" width="4" height="82" rx="2" fill="#7c3aed"/>
  <text x="54" y="326" font-size="14" font-weight="600" fill="#0f172a">结构化路由（不调模型）</text>
  <text x="54" y="348" font-size="12.5" fill="#64748b">意图 + 关键词命中 + 实体抽取 → 各领域分数</text>
  <text x="54" y="368" font-size="12.5" fill="#64748b">→ primary / supporting 协同 / routing_reason · Monitor 成功率降权后回退服务台</text>

  <!-- 箭头 4→5 -->
  <line x1="312" y1="382" x2="312" y2="404" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ 行 5 角色 ============ -->
  <rect x="32" y="406" width="560" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="406" width="4" height="82" rx="2" fill="#d97706"/>
  <text x="54" y="432" font-size="14" font-weight="600" fill="#0f172a">五个教学角色</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="54" y="444" width="96" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="102" y="461" fill="#9a3412" font-weight="600">GENERAL 服务台</text>
    <rect x="158" y="444" width="86" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="201" y="461" fill="#9a3412" font-weight="600">TUTOR 讲题</text>
    <rect x="252" y="444" width="86" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="295" y="461" fill="#9a3412" font-weight="600">PLAN 规划</text>
    <rect x="346" y="444" width="86" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="389" y="461" fill="#9a3412" font-weight="600">EXAM 考务</text>
    <rect x="440" y="444" width="132" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="506" y="461" fill="#9a3412" font-weight="600">ESCALATION 交接</text>
  </g>

  <!-- 箭头 5→6 -->
  <line x1="312" y1="488" x2="312" y2="510" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ 行 6 输出 ============ -->
  <rect x="32" y="512" width="560" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="512" width="4" height="82" rx="2" fill="#475569"/>
  <text x="54" y="538" font-size="14" font-weight="600" fill="#0f172a">回答组装与出口</text>
  <text x="54" y="560" font-size="12.5" fill="#64748b">回答校验：命中敏感或超范围内容 → 转人工交接</text>
  <text x="54" y="580" font-size="12.5" fill="#64748b">SSE 流式返回 · 每步写入 trace，便于复盘定位</text>

  <!-- ============ 右侧支撑能力 ============ -->
  <g>
    <!-- LLM 网关 -->
    <rect x="616" y="104" width="312" height="108" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="616" y="104" width="4" height="108" rx="2" fill="#2563eb"/>
    <text x="636" y="130" font-size="13.5" font-weight="600" fill="#0f172a">LLM 网关</text>
    <text x="636" y="152" font-size="11.5" fill="#64748b">LangChain4j · anthropic / deepseek Profile 切换</text>
    <text x="636" y="172" font-size="11.5" fill="#64748b">超时控制 + 调用预算 + 失败降级</text>
    <text x="636" y="192" font-size="11.5" fill="#64748b">输出结构化解析失败时回落规则路径</text>

    <!-- 知识检索 -->
    <rect x="616" y="230" width="312" height="108" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="616" y="230" width="4" height="108" rx="2" fill="#0d9488"/>
    <text x="636" y="256" font-size="13.5" font-weight="600" fill="#0f172a">知识检索</text>
    <text x="636" y="278" font-size="11.5" fill="#64748b">BM25 + 向量双路召回，min-max 归一化后融合</text>
    <text x="636" y="298" font-size="11.5" fill="#64748b">查询改写 → 并行召回 → 内容哈希去重 → LLM 重排</text>
    <text x="636" y="318" font-size="11.5" fill="#64748b">Chroma 持久化，教材 8 篇默认语料</text>

    <!-- 工具治理 -->
    <rect x="616" y="356" width="312" height="108" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="616" y="356" width="4" height="108" rx="2" fill="#7c3aed"/>
    <text x="636" y="382" font-size="13.5" font-weight="600" fill="#0f172a">工具治理</text>
    <text x="636" y="404" font-size="11.5" fill="#64748b">TTL 缓存 · 三态熔断（关闭 / 半开 / 打开）· 超时</text>
    <text x="636" y="424" font-size="11.5" fill="#64748b">统一 fallback，MCP 工具白名单只读</text>
    <text x="636" y="444" font-size="11.5" fill="#64748b">教学约束工具化：卡点归类 / 负荷校验 / 考务口径</text>

    <!-- 记忆与评测 -->
    <rect x="616" y="482" width="312" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="616" y="482" width="4" height="112" rx="2" fill="#d97706"/>
    <text x="636" y="508" font-size="13.5" font-weight="600" fill="#0f172a">记忆与评测</text>
    <text x="636" y="530" font-size="11.5" fill="#64748b">Redis 工作记忆：15 条压缩保留 5 条，Lua 保并发安全</text>
    <text x="636" y="550" font-size="11.5" fill="#64748b">语义记忆 + 学生画像 · 长期偏好沉淀</text>
    <text x="636" y="570" font-size="11.5" fill="#64748b">LLM-as-Judge 四维 · 意图 / 对话用例 · 5% 回归检测</text>
  </g>

  <!-- 虚线调用关系：支撑能力汇总后接入主链路 -->
  <g stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="616" y1="158" x2="604" y2="158"/>
    <line x1="616" y1="284" x2="604" y2="284"/>
    <line x1="616" y1="410" x2="604" y2="410"/>
    <line x1="616" y1="536" x2="604" y2="536"/>
    <line x1="604" y1="158" x2="604" y2="536"/>
  </g>
  <line x1="604" y1="447" x2="592" y2="447" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- 图例 -->
  <text x="32" y="628" font-size="11.5" fill="#94a3b8">实线箭头：请求主链路　·　虚线箭头：按需调用的支撑能力　·　左侧色条对应不同处理阶段</text>
</svg>
